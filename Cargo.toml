[package]
name = "amber-dav"
# Version passed at build time by GHA
version = "0.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
axum = "0.8"
dav-server = "0.11"
rand = "0.9"
qrcode = "0.14"
font8x8 = "0.3"
local-ip-address = "0.6"
base64 = "0.22"
# Constant-time comparison for the login password, session cookie, and WebDAV
# Basic auth checks. Tiny, no_std, no dependencies — fits the size budget.
constant_time_eq = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", features = ["io"] }
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Verifies self-update downloads against the release's SHA256SUMS asset.
# Pure Rust, so the static musl builds keep working.
sha2 = "0.10"
# Formats/parses Last-Modified and If-Modified-Since dates for the cache
# validators on /api/raw and /api/thumb. Already in the tree via hyper.
httpdate = "1"
# CLI parsing and free --help/--version. (Env-var fallbacks are resolved
# manually so CLI > env > file > default precedence stays predictable, including
# for the positional root/port args.)
clap = { version = "4", features = ["derive"] }
# Platform-standard config directory for desktop/server (headless) builds. Only
# referenced under cfg(not(any(feature = "fb", feature = "sdl"))); idle weight
# otherwise.
directories = "6"
jsonc-parser = { version = "0.32.4", features = ["serde"] }
# Decodes and downscales images: the /api/thumb endpoint on every build shape,
# plus the burn-in "DVD bounce" screensaver under fb/sdl. Pure-Rust codecs
# only, so the static musl builds keep working.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# Test-only: drive the full router through `tower::ServiceExt::oneshot` (no
# socket, no process) and collect response bodies. Both are already in the
# dependency graph via axum, so this adds no new code to vendor.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# On-device builds come in two shapes, each selected by its own feature. Both
# pull in the same substrate — gamepad input, the screen Mode state machine, the
# DVD-bounce screensaver, and config-beside-the-binary — and differ only in the
# display sink. Opt-in, not default: headless desktop/server builds leave both
# off and ship without any of the device-only deps.
[features]
# Static framebuffer/Wayland sink (Anbernic; Steam Deck without SDL).
fb = ["dep:evdev", "dep:framebuffer", "dep:smithay-client-toolkit"]
# Dynamic SDL2 on-screen sink: links the system libSDL2 (not static musl) and
# brings its own sink, so it does not pull the framebuffer/Wayland crates. Steam
# Deck + Anbernic. If both `fb` and `sdl` are enabled, `sdl` wins.
sdl = ["dep:evdev", "dep:sdl2"]

# statvfs for the free-disk-space gauge on /api/info. Already in the
# dependency graph many times over (tokio, reqwest, …), so this vendors no
# new code; non-unix targets simply report the fields as null.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Device-only deps. Linux-only crates (framebuffer/evdev/sdl2), pulled in solely
# by the `fb`/`sdl` features, which are only ever built for the handheld devices.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"], optional = true }
framebuffer = { version = "0.3", optional = true }
# Pure-Rust Wayland client (no libwayland; static-musl friendly). Drives the
# Steam Deck screen, where Gamescope owns DRM and /dev/fb0 is hidden.
# default-features disabled on purpose: the defaults pull in `xkbcommon` (a C
# library, breaks the static-musl build) and `calloop` for keyboard/seat
# handling we do not use — we dispatch the queue directly and only need the
# compositor/xdg-shell/wl_shm/output globals.
smithay-client-toolkit = { version = "0.20", default-features = false, optional = true }
# Dynamically links the system libSDL2 so the device's own driver is used at
# runtime (Xwayland on the Steam Deck, the `mali` vendor driver on Anbernic).
sdl2 = { version = "0.38", optional = true }

# Small, static-friendly release binary for the handhelds.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The image decoders run hot on the handheld's A53 cores — the bounce
# screensaver's sprite-pool fill and every /api/thumb render — and opt-level
# "z" makes those pixel loops several times slower (issue #40). Optimize just
# this dependency for speed; the size-first default stays for everything else.
[profile.release.package.image]
opt-level = 3
