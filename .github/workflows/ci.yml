name: CI

on:
  pull_request:
  # Direct-to-main commits must pass the same gates as PRs — untested pushes
  # otherwise feed the release workflow (issue #51, review §2.20).
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes. PR runs and main
# pushes live in different groups (refs/pull/N/merge vs refs/heads/main), so a
# merge doesn't cancel anything mid-flight; rapid successive merges to main
# supersede each other, which is the dedup we want.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # The SPA's JS is a standalone file, so a syntax error in it no longer
      # hides inside app.html where nothing ever parsed it. Node is preinstalled
      # on the runner; --check parses without executing, for pennies.
      - name: JS syntax check (app.js)
        run: node --check src/web/app.js

      # Device launcher scripts are shell, and mux_launch.sh never runs in CI
      # (it needs the handheld), so bash -n is the only thing that catches a
      # syntax error in it. Same cheap-early-signal idea as the app.js check.
      - name: Shell syntax check (device launchers)
        run: |
          bash -n device/anbernic/AmberDAV.sh
          bash -n device/muos/mux_launch.sh
          bash -n device/muos/build-muxapp.sh

      # Default (headless) build: the server/desktop configuration, no
      # device-only deps. This is what the x86_64-linux release asset ships.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The device-only screen/input code (evdev, framebuffer, image, smithay)
      # is gated behind --features fb, so exercise it explicitly here — this
      # mirrors the -fb release assets' feature set.
      - name: Clippy (fb)
        run: cargo clippy --all-targets --features fb -- -D warnings

      - name: Test (fb)
        run: cargo test --all-targets --features fb

      # The SDL on-screen sink (--features sdl) links the system libSDL2 and
      # swaps out the framebuffer/Wayland sink; exercise it too. Mirrors the
      # -sdl release assets.
      - name: Install libSDL2 (sdl)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Clippy (sdl)
        run: cargo clippy --all-targets --features sdl -- -D warnings

      - name: Test (sdl)
        run: cargo test --all-targets --features sdl

  # The two workflow matrices are line-for-line duplicates by design; the
  # matrix-sync job below fails the PR if they drift (issue #51, review §3.10).
  matrix-sync:
    name: matrix sync (ci ↔ release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare the ci.yml and release.yml build matrices
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_matrix_sync.py

  # Compile every shipped release target (and feature set) so target-specific
  # breakage — a cross-compile, a feature-gated dep, the ring/musl/ARM-Windows
  # toolchains — surfaces on the PR instead of at release time. This mirrors the
  # release matrix exactly; it is build-only (debug, no upload) since the test
  # job above already runs fmt/clippy/tests for all feature sets.
  #
  # MATRIX SYNC (issue #51): this include list must stay identical to the one
  # in release.yml (the matrix-sync job enforces that), and is mirrored by
  # src/update.rs::asset_for and the README's asset table — change one,
  # change all four.
  build:
    name: build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl, cross-linked with Zig. Only the device
          # asset is built with --features fb.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux-fb
            features: fb
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux
            zig: true
          # x86_64 static musl WITH the fb feature — the
          # on-device Wayland screen + gamepad viewer compiled for x86.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux-fb
            features: fb
            zig: true
          # SDL2 on-screen build for the Steam Deck: native x86_64
          # gnu, dynamically links the system libSDL2. Uses --features sdl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: amber-dav-x86_64-linux-sdl
            features: sdl
            sdl: true
          # SDL2 on-screen build for Anbernic handhelds: native aarch64 gnu on an
          # arm64 runner (the device's libSDL2 provides the `mali` driver at runtime).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: amber-dav-aarch64-linux-sdl
            features: sdl
            sdl: true
          # macOS: both arches on the arm64 runner (Apple SDK is universal).
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: amber-dav-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: amber-dav-x86_64-macos
          # Windows: native x86_64 and cross-compiled aarch64 (ARM) via MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: amber-dav-x86_64-windows
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: amber-dav-aarch64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per asset: the fb and headless aarch64 builds share a
          # target triple but compile different feature sets.
          key: ${{ matrix.asset }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Prebuilt binary via install-action — `cargo install` compiled
      # cargo-zigbuild from source on every cache-cold run (issue #51).
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install libSDL2 (sdl builds)
        if: matrix.sdl
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      # Publish each build as a downloadable artifact so reviewers can grab a
      # binary straight off the PR's checks page (or `gh run download`) to test
      # on real hardware. These are debug builds — unoptimized and large, but
      # the same feature set as the matching release asset. Rename to the asset
      # name first so the extracted file is recognizable, not a bare `amber-dav`.
      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/debug/amber-dav${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}${{ matrix.ext }}
          # Test artifacts, not releases — expire them quickly to avoid bloat.
          retention-days: 3

  # Exercise the muOS .muxapp packaging on every PR so launcher/layout breakage
  # surfaces here, not at release time — the release.yml `muxapp` job runs the
  # exact same device/muos/build-muxapp.sh. Reuses the sdl binary the build job
  # already produced (debug, but the right shape) and uploads the resulting
  # .muxapp so it can be grabbed off the PR and installed on a device.
  muxapp:
    name: muxapp (muOS package)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download sdl binary
        uses: actions/download-artifact@v7
        with:
          name: amber-dav-aarch64-linux-sdl

      - name: Package and verify .muxapp
        env:
          # Use a relative MUXAPP_OUT, exactly like the release job — that path
          # (zip runs from the staging dir) is what broke the release once; CI
          # missing it was the gap. Keep this relative so CI guards it.
          MUXAPP_OUT: AmberDAV.muxapp
        run: |
          chmod +x device/muos/build-muxapp.sh
          device/muos/build-muxapp.sh amber-dav-aarch64-linux-sdl
          # Fail loudly if the inner AmberDAV/ layout muOS expects is missing.
          names="$(unzip -Z1 AmberDAV.muxapp)"
          echo "$names"
          for f in AmberDAV/mux_launch.sh AmberDAV/amber-dav AmberDAV/glyph/amberdav.png; do
            echo "$names" | grep -qx "$f" || { echo "::error::.muxapp missing $f"; exit 1; }
          done

      - name: Upload .muxapp
        uses: actions/upload-artifact@v7
        with:
          name: AmberDAV.muxapp
          path: AmberDAV.muxapp
          retention-days: 3

  docker:
    name: Build & Publish Docker Image (PR/Edge)
    needs: [build, test]
    # Only run the docker job on pushes to main or PRs from the same repository
    # (forks don't have write access to GHCR).
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: amber-dav-x86_64-linux
          path: dist

      - name: Download aarch64 binary
        uses: actions/download-artifact@v7
        with:
          name: amber-dav-aarch64-linux
          path: dist

      - name: Stage binaries for Docker build
        run: |
          mv dist/amber-dav-x86_64-linux dist/amber-dav-amd64
          mv dist/amber-dav-aarch64-linux dist/amber-dav-arm64

      - name: Downcase repository name for GHCR tag compat
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:pr-${{ github.event.pull_request.number }},ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:edge,ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

