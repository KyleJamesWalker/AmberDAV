name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Default (headless) build: the server/desktop configuration, no
      # device-only deps. This is what the x86_64-linux release asset ships.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The device-only screen/input code (evdev, framebuffer, image, smithay)
      # is gated behind --features fb, so exercise it explicitly here — this
      # mirrors the -fb release assets' feature set.
      - name: Clippy (fb)
        run: cargo clippy --all-targets --features fb -- -D warnings

      - name: Test (fb)
        run: cargo test --all-targets --features fb

      # The SDL on-screen sink (--features sdl) links the system libSDL2 and
      # swaps out the framebuffer/Wayland sink; exercise it too. Mirrors the
      # -sdl release assets.
      - name: Install libSDL2 (sdl)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Clippy (sdl)
        run: cargo clippy --all-targets --features sdl -- -D warnings

      - name: Test (sdl)
        run: cargo test --all-targets --features sdl

  # Compile every shipped release target (and feature set) so target-specific
  # breakage — a cross-compile, a feature-gated dep, the ring/musl/ARM-Windows
  # toolchains — surfaces on the PR instead of at release time. This mirrors the
  # release matrix exactly; it is build-only (debug, no upload) since the test
  # job above already runs fmt/clippy/tests for all feature sets.
  build:
    name: build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl, cross-linked with Zig. Only the device
          # asset is built with --features fb.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux-fb
            features: fb
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux
            zig: true
          # x86_64 static musl WITH the fb feature — the
          # on-device Wayland screen + gamepad viewer compiled for x86.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux-fb
            features: fb
            zig: true
          # SDL2 on-screen build for the Steam Deck: native x86_64
          # gnu, dynamically links the system libSDL2. Uses --features sdl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: amber-dav-x86_64-linux-sdl
            features: sdl
            sdl: true
          # SDL2 on-screen build for Anbernic handhelds: native aarch64 gnu on an
          # arm64 runner (the device's libSDL2 provides the `mali` driver at runtime).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: amber-dav-aarch64-linux-sdl
            features: sdl
            sdl: true
          # macOS: both arches on the arm64 runner (Apple SDK is universal).
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: amber-dav-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: amber-dav-x86_64-macos
          # Windows: native x86_64 and cross-compiled aarch64 (ARM) via MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: amber-dav-x86_64-windows
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: amber-dav-aarch64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per asset: the fb and headless aarch64 builds share a
          # target triple but compile different feature sets.
          key: ${{ matrix.asset }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          zig-version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Install libSDL2 (sdl builds)
        if: matrix.sdl
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}
