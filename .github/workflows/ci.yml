name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Default (headless) build: the server/desktop configuration, no
      # device-only deps. This is what the x86_64-linux release asset ships.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The device-only screen/input code (evdev, framebuffer, font8x8, image)
      # is gated behind --features handheld, so exercise it explicitly here —
      # this mirrors the aarch64-linux release asset's feature set.
      - name: Clippy (handheld)
        run: cargo clippy --all-targets --features handheld -- -D warnings

      - name: Test (handheld)
        run: cargo test --all-targets --features handheld

  # Compile every shipped release target (and feature set) so target-specific
  # breakage — a cross-compile, a feature-gated dep, the ring/musl/ARM-Windows
  # toolchains — surfaces on the PR instead of at release time. This mirrors the
  # release matrix exactly; it is build-only (debug, no upload) since the test
  # job above already runs fmt/clippy/tests for both feature sets.
  build:
    name: build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl, cross-linked with Zig. Only the device
          # asset is built with --features handheld.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux-handheld
            features: handheld
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux
            zig: true
          # Steam Deck (Game Mode): x86_64 static musl WITH the handheld feature
          # — the on-device Wayland screen + gamepad viewer compiled for x86.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux-handheld
            features: handheld
            zig: true
          # macOS: both arches on the arm64 runner (Apple SDK is universal).
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: amber-dav-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: amber-dav-x86_64-macos
          # Windows: native x86_64 and cross-compiled aarch64 (ARM) via MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: amber-dav-x86_64-windows
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: amber-dav-aarch64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per asset: the handheld and headless aarch64 builds share a
          # target triple but compile different feature sets.
          key: ${{ matrix.asset }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          zig-version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}
