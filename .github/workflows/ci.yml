name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Default (headless) build: the server/desktop configuration, no
      # device-only deps. This is what the x86_64-linux release asset ships.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The device-only screen/input code (evdev, framebuffer, font8x8, image)
      # is gated behind --features handheld, so exercise it explicitly here —
      # this mirrors the aarch64-linux release asset's feature set.
      - name: Clippy (handheld)
        run: cargo clippy --all-targets --features handheld -- -D warnings

      - name: Test (handheld)
        run: cargo test --all-targets --features handheld

  # The macOS/Windows CLI builds ship as release assets, so make sure they keep
  # compiling on every change — the device's Linux-only code is cfg'd out there.
  cross-build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked
