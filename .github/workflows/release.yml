name: Release

# Triggered when a GitHub Release is published — via the Releases UI or, the
# recommended invocation (issue #51):
#
#   gh release create vX.Y.Z --generate-notes
#
# (--generate-notes drafts the release body from the merged PRs since the
# last tag.) The release tag drives the version; this workflow builds a
# binary per platform and attaches each to the release.
#
#   amber-dav-aarch64-linux-fb        static musl build for the Anbernic device
#   amber-dav-aarch64-linux           static musl build for ARM servers/Pi/NAS (headless)
#   amber-dav-x86_64-linux            static musl build for x86 servers/NAS (headless)
#   amber-dav-x86_64-linux-fb         static musl build for x86 handhelds
#   amber-dav-x86_64-linux-sdl        SDL2 on-screen build for Steam Deck
#   amber-dav-aarch64-linux-sdl       SDL2 on-screen build for Anbernic handhelds
#   amber-dav-aarch64-macos    Apple Silicon CLI build
#   amber-dav-x86_64-macos     Intel macOS CLI build
#   amber-dav-x86_64-windows   Windows CLI build
#   amber-dav-aarch64-windows  ARM Windows CLI build (Snapdragon/Copilot+ PCs)
#
# Assets follow `amber-dav-<arch>-<os>[-fb|-sdl]`. The `-fb` assets use
# `--features fb` (static framebuffer/Wayland screen + gamepad input); the `-sdl`
# assets use `--features sdl` (SDL2 on-screen display, dynamically linked); every
# other asset is a plain headless WebDAV/file-server CLI with device-only deps
# left out entirely.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # upload assets to the release

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # MATRIX SYNC (issue #51): this include list must stay identical to the
      # one in ci.yml (CI's matrix-sync job enforces that), and is mirrored by
      # src/update.rs::asset_for and the README's asset table — change one,
      # change all four.
      matrix:
        include:
          # Device build: fully static aarch64 musl, cross-linked with Zig.
          # Built with --features fb (framebuffer + gamepad UI).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux-fb
            features: fb
            zig: true
          # Headless ARM server build: same aarch64 musl target, no device
          # feature. For Raspberry Pi, ARM NAS, and ARM cloud (Graviton/Ampere).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux
            zig: true
          # Headless x86 server build: fully static musl, cross-linked with Zig.
          # For NAS boxes, home servers, Docker — no device-only deps compiled in.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux
            zig: true
          # x86_64 static musl with --features fb
          # (Wayland connection-info screen + gamepad viewer).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux-fb
            features: fb
            zig: true
          # SDL2 on-screen build for the Steam Deck: native x86_64
          # gnu, dynamically links the system libSDL2. Uses --features sdl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: amber-dav-x86_64-linux-sdl
            features: sdl
            sdl: true
          # SDL2 on-screen build for Anbernic handhelds: native aarch64 gnu on an
          # arm64 runner (the device's libSDL2 provides the `mali` driver at runtime).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: amber-dav-aarch64-linux-sdl
            features: sdl
            sdl: true
          # Desktop CLI builds. Both macOS targets run on macos-latest (Apple
          # Silicon); x86_64-apple-darwin is cross-compiled — the Apple SDK on
          # arm64 runners supports both architectures, so no special linker needed.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: amber-dav-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: amber-dav-x86_64-macos
          # Windows CLI builds. windows-latest (x86_64 runner) builds the native
          # x86_64 target and cross-compiles the aarch64 (ARM) target via MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: amber-dav-x86_64-windows
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: amber-dav-aarch64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per asset, not per target: the fb and headless aarch64
          # builds share a target triple but compile different feature sets.
          key: ${{ matrix.asset }}

      # The release tag is the single source of truth for the version. Cargo.toml
      # carries only a 0.0.0 placeholder, so stamp the tag in here before building:
      # env!("CARGO_PKG_VERSION") is compiled into the binary (and drawn on the
      # device screen), so it must reflect the release, not the placeholder.
      #
      # Plain text substitution rather than cargo-edit's `cargo set-version`:
      # installing cargo-edit compiled it from source in every matrix job,
      # several cache-cold minutes each (issue #51). Same end state: BOTH
      # files carry the tag version — the builds below run with --locked,
      # which fails if Cargo.lock still records the placeholder — and
      # build.rs passes any non-0.0.0 version through verbatim without
      # touching git (issue #46), so the binary reports exactly the tag.
      - name: Stamp version from release tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # A release event can fire before GitHub's tag/release state is
          # consistent, delivering an empty GITHUB_REF_NAME. Catch that here:
          # the grep guards below would otherwise pass ('version = ""' matches
          # the empty-$v pattern), deferring failure to an opaque cargo
          # "empty string, expected a semver version" three steps later.
          [ -n "$v" ] || { echo "::error::GITHUB_REF_NAME empty — release event carried no tag name"; exit 1; }
          # Cargo.toml: the [package] version is the only 0.0.0 line.
          sed 's/^version = "0.0.0"$/version = "'"$v"'"/' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          # Cargo.lock: only the amber-dav entry — a dependency could
          # legitimately be version 0.0.0, so anchor on the package name.
          awk -v v="$v" '
            $0 == "name = \"amber-dav\"" { in_pkg = 1 }
            in_pkg && $0 == "version = \"0.0.0\"" { $0 = "version = \"" v "\""; in_pkg = 0 }
            { print }
          ' Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp Cargo.lock
          # Loud failure beats a release stamped 0.0.0 (or a --locked error
          # three steps later) if the placeholder or tag shape ever changes.
          grep -q "^version = \"$v\"\$" Cargo.toml || { echo "::error::Cargo.toml not stamped to '$v'"; exit 1; }
          grep -q "^version = \"$v\"\$" Cargo.lock || { echo "::error::Cargo.lock not stamped to '$v'"; exit 1; }

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Prebuilt binary via install-action — `cargo install` compiled
      # cargo-zigbuild from source on every cache-cold run (issue #51).
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install libSDL2 (sdl builds)
        if: matrix.sdl
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Stage asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/amber-dav${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}${{ matrix.ext }}" --clobber

  # muOS one-file install: repackage the already-built
  # aarch64-linux-sdl binary as AmberDAV-<version>.muxapp — a ZIP holding
  # AmberDAV/{mux_launch.sh, amber-dav, glyph/amberdav.png}. Users drop it
  # into /mnt/mmc/ARCHIVE and install via Archive Manager. The packaging is
  # done by device/muos/build-muxapp.sh so local builds and CI stay identical.
  # The SDL build (not fb) because muOS composites SDL instantly, where the raw
  # framebuffer build's screen lags as muOS's UI overwrites it.
  #
  # Self-update note: a .muxapp is a repackaged -sdl binary, so a muOS install
  # self-updates as aarch64-linux-sdl (update::asset_for) — the loose binary,
  # not a re-wrapped .muxapp. Acceptable; revisit if muOS users want otherwise.
  muxapp:
    name: AmberDAV.muxapp
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download sdl binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'amber-dav-aarch64-linux-sdl' --dir .
      - name: Package .muxapp
        env:
          # Versioned name; checksums job picks it up by the AmberDAV-*.muxapp glob.
          MUXAPP_OUT: AmberDAV-${{ github.ref_name }}.muxapp
        run: |
          chmod +x device/muos/build-muxapp.sh
          device/muos/build-muxapp.sh amber-dav-aarch64-linux-sdl
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "AmberDAV-${{ github.ref_name }}.muxapp" --clobber

  # Once every binary is attached, hash them all into a single SHA256SUMS
  # asset (`<hex>  <asset-name>` lines, sha256sum format). The in-app updater
  # downloads this file and refuses to install a binary whose hash doesn't
  # match, so it must be generated after — and from — the uploaded assets.
  # Depends on muxapp too so the .muxapp is hashed alongside the binaries.
  checksums:
    name: SHA256SUMS
    needs: [build, muxapp]
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'amber-dav-*' --pattern 'AmberDAV-*.muxapp' --dir assets
          (cd assets && sha256sum *) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber \
            --repo "$GITHUB_REPOSITORY"

  docker:
    name: Build & Publish Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'amber-dav-x86_64-linux' --dir dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern 'amber-dav-aarch64-linux' --dir dist
          mv dist/amber-dav-x86_64-linux dist/amber-dav-amd64
          mv dist/amber-dav-aarch64-linux dist/amber-dav-arm64

      - name: Downcase repository name for GHCR tag compat
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}
