name: Release

# Triggered when a GitHub Release is published (created via the Releases UI or
# `gh release create`). The release tag drives the version; this workflow builds
# a binary per platform and attaches each to the release.
#
#   amber-dav-aarch64-linux-fb        static musl build for the Anbernic device
#   amber-dav-aarch64-linux           static musl build for ARM servers/Pi/NAS (headless)
#   amber-dav-x86_64-linux            static musl build for x86 servers/NAS (headless)
#   amber-dav-x86_64-linux-fb         static musl build for x86 handhelds
#   amber-dav-x86_64-linux-sdl        SDL2 on-screen build for Steam Deck
#   amber-dav-aarch64-linux-sdl       SDL2 on-screen build for Anbernic handhelds
#   amber-dav-aarch64-macos    Apple Silicon CLI build
#   amber-dav-x86_64-macos     Intel macOS CLI build
#   amber-dav-x86_64-windows   Windows CLI build
#   amber-dav-aarch64-windows  ARM Windows CLI build (Snapdragon/Copilot+ PCs)
#
# Assets follow `amber-dav-<arch>-<os>[-fb|-sdl]`. The `-fb` assets use
# `--features fb` (static framebuffer/Wayland screen + gamepad input); the `-sdl`
# assets use `--features sdl` (SDL2 on-screen display, dynamically linked); every
# other asset is a plain headless WebDAV/file-server CLI with device-only deps
# left out entirely.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # upload assets to the release

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Device build: fully static aarch64 musl, cross-linked with Zig.
          # Built with --features fb (framebuffer + gamepad UI).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux-fb
            features: fb
            zig: true
          # Headless ARM server build: same aarch64 musl target, no device
          # feature. For Raspberry Pi, ARM NAS, and ARM cloud (Graviton/Ampere).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: amber-dav-aarch64-linux
            zig: true
          # Headless x86 server build: fully static musl, cross-linked with Zig.
          # For NAS boxes, home servers, Docker — no device-only deps compiled in.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux
            zig: true
          # x86_64 static musl with --features fb
          # (Wayland connection-info screen + gamepad viewer).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: amber-dav-x86_64-linux-fb
            features: fb
            zig: true
          # SDL2 on-screen build for the Steam Deck: native x86_64
          # gnu, dynamically links the system libSDL2. Uses --features sdl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: amber-dav-x86_64-linux-sdl
            features: sdl
            sdl: true
          # SDL2 on-screen build for Anbernic handhelds: native aarch64 gnu on an
          # arm64 runner (the device's libSDL2 provides the `mali` driver at runtime).
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: amber-dav-aarch64-linux-sdl
            features: sdl
            sdl: true
          # Desktop CLI builds. Both macOS targets run on macos-latest (Apple
          # Silicon); x86_64-apple-darwin is cross-compiled — the Apple SDK on
          # arm64 runners supports both architectures, so no special linker needed.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: amber-dav-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: amber-dav-x86_64-macos
          # Windows CLI builds. windows-latest (x86_64 runner) builds the native
          # x86_64 target and cross-compiles the aarch64 (ARM) target via MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: amber-dav-x86_64-windows
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: amber-dav-aarch64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per asset, not per target: the fb and headless aarch64
          # builds share a target triple but compile different feature sets.
          key: ${{ matrix.asset }}

      # The release tag is the single source of truth for the version. Cargo.toml
      # carries only a 0.0.0 placeholder, so stamp the tag in here before building:
      # env!("CARGO_PKG_VERSION") is compiled into the binary (and drawn on the
      # device screen), so it must reflect the release, not the placeholder.
      - name: Stamp version from release tag
        shell: bash
        run: |
          cargo install cargo-edit --locked
          cargo set-version "${GITHUB_REF_NAME#v}"

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          zig-version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked

      - name: Install libSDL2 (sdl builds)
        if: matrix.sdl
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --locked ${{ matrix.features && format('--features {0}', matrix.features) }}

      - name: Stage asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/amber-dav${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}${{ matrix.ext }}" --clobber
